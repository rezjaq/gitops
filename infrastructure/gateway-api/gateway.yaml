# =============================================================================
# Envoy Gateway API — GatewayClass + Gateway untuk course
# Domain: argocd.naipospos.cloud (dan app lain nanti)
# SSL: cert yang di-generate sendiri (bukan Let's Encrypt)
# Pola mengikuti: example-project/cicd/gitops/headoffice-revamp/infrastructure/
# =============================================================================

# EnvoyProxy — konfigurasi data plane Envoy untuk cluster lokal KinD
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: course-envoy-proxy
  namespace: argocd
spec:
  provider:
    type: Kubernetes
    kubernetes:
      useListenerPortAsContainerPort: true
      envoyService:
        type: ClusterIP
      envoyDeployment:
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  nodeSelector:
                    node-role.kubernetes.io/control-plane: ""
                  tolerations:
                    - key: "node-role.kubernetes.io/control-plane"
                      operator: "Exists"
                      effect: "NoSchedule"
                  containers:
                    - name: envoy
                      ports:
                        - containerPort: 80
                          hostPort: 80
---
# GatewayClass — controller Envoy Gateway mengacu ke EnvoyProxy config
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: course-envoy-proxy
    namespace: argocd
---
# Gateway — listener HTTP
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: course-gateway
  namespace: argocd
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              shared-gateway-access: "true"
