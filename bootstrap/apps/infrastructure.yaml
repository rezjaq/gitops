# Child Application: infrastructure (platform services)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure
  namespace: argocd
spec:
  project: course
  source:
    repoURL: "https://github.com/rezanaipospos/gitops.git"  # <- GANTI
    targetRevision: HEAD
    path: infrastructure
  destination:
    server: "https://kubernetes.default.svc"
    namespace: infrastructure
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
