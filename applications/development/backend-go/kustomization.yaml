# backend-go — development environment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../common
- secret.yaml
- network/http-route.yaml

namespace: backend-development

namePrefix: backend-go-

labels:
- pairs:
    service_group: course-project
    service_type: backend
    environment: development
    service_name: backend-go
    app: backend-go
  includeTemplates: true

patches:
- path: patch/deployment.yaml
- path: patch/pdb.yaml
# Override selector Deployment dan pod template labels agar pakai app: backend-go
- patch: |
    - op: replace
      path: /spec/selector/matchLabels/app
      value: backend-go
    - op: replace
      path: /spec/template/metadata/labels/app
      value: backend-go
    - op: replace
      path: /spec/template/spec/affinity/podAntiAffinity/preferredDuringSchedulingIgnoredDuringExecution/0/podAffinityTerm/labelSelector/matchLabels/app
      value: backend-go
  target:
    kind: Deployment
    name: dpl
# Override Service selector agar pakai app: backend-go (match Deployment)
- patch: |
    - op: replace
      path: /spec/selector/app
      value: backend-go
  target:
    kind: Service
# Remove minAvailable (dev: allow full disruption)
- patch: |
    - op: remove
      path: /spec/minAvailable
  target:
    kind: PodDisruptionBudget
    name: pdb

# Replacements — auto-wire names via namePrefix
replacements:
- source:
    kind: ServiceAccount
    name: backend-go
    fieldPath: metadata.name
  targets:
  - select:
      kind: Deployment
    fieldPaths:
    - spec.template.spec.serviceAccountName
- source:
    kind: Service
    name: svc
    fieldPath: metadata.name
  targets:
  - select:
      kind: HTTPRoute
    fieldPaths:
    - spec.rules.0.backendRefs.0.name
- source:
    kind: Deployment
    fieldPath: metadata.name
  targets:
  - select:
      kind: HorizontalPodAutoscaler
    fieldPaths:
    - spec.scaleTargetRef.name
